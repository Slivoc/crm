<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Aerospace hardware</title>
  <desc id="description">Abstract aircraft skin and fastener pattern used when no verified subject image is available.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2537"/><stop offset="1" stop-color="#19647e"/>
    </linearGradient>
    <pattern id="fasteners" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="90" cy="90" r="22" fill="#b9ccd3"/><circle cx="90" cy="90" r="11" fill="#5d7884"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M-80 760 C360 300 890 200 1680 80 L1680 980 L-80 980Z" fill="#dce7ea" opacity=".16"/>
  <path d="M-50 810 C420 350 940 250 1650 150" fill="none" stroke="#e7f0f2" stroke-width="5" opacity=".35"/>
  <rect width="1600" height="900" fill="url(#fasteners)" opacity=".32"/>
  <g fill="#fff" opacity=".92" transform="translate(128 650)">
    <path d="M0 58h270l115-58h52l-80 58h210c32 0 58 26 58 58H0z"/>
